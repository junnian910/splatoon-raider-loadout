<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>配装器 · 秘宝库</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <main class="page-shell library-page library-page--treasures">
    <section class="library-masthead">
      <div><h1>秘宝数据库</h1></div>
      <div class="stat-stack"><strong id="activeCount">0</strong><span>秘宝数量</span><div class="library-actions"><button class="button button-solid" id="addTreasure" type="button">添加秘宝</button></div></div>
    </section>
    <section class="library-toolbar"><label><span>搜索</span><input class="control" id="search" type="search" placeholder="名称或说明"></label><label><span>归属</span><select class="control" id="scopeFilter"><option value="all">全部归属</option><option value="common">普通秘宝</option><option value="power">力量</option><option value="speed">速度</option><option value="technique">技巧</option></select></label><label><span>状态</span><select class="control" id="statusFilter"><option value="active">使用中</option><option value="deleted">已删除</option><option value="all">全部</option></select></label></section>
    <section class="treasure-library-grid" id="treasureRows"></section>
  </main>
  <dialog class="dialog editor-dialog" id="treasureDialog">
    <form id="treasureForm"><div class="dialog-head"><div><h2 id="dialogTitle">添加秘宝</h2></div><button class="icon-button" data-close type="button">关闭</button></div>
      <div class="form-grid"><label><span>名称</span><input class="control" id="name" required maxlength="40"></label><label><span>归属</span><select class="control" id="scope"><option value="common">普通秘宝</option><option value="power">力量背包</option><option value="speed">速度背包</option><option value="technique">技巧背包</option></select></label><label class="field-wide"><span>悬浮说明</span><input class="control" id="description" required maxlength="120"></label><label class="field-wide"><span>图片</span><input class="control" id="image" type="file" accept="image/png,image/jpeg,image/webp"><small>建议方形图片，最大 5MB。</small></label><div class="upload-preview field-wide" id="preview"></div></div>
      <div class="dialog-actions"><button class="button button-quiet" data-close type="button">取消</button><button class="button button-solid" type="submit">保存秘宝</button></div>
    </form>
  </dialog>
  <dialog class="dialog dialog-share" id="confirmDialog">
    <div class="dialog-head"><h2>确认操作</h2></div>
    <p style="padding:1.5rem;margin:0;font-size:1.05rem;" id="confirmMessage"></p>
    <div class="dialog-actions" style="padding:0 1rem 1rem;"><button class="button button-quiet" id="confirmNo" type="button">取消</button><button class="button button-solid" id="confirmYes" type="button">确认</button></div>
  </dialog>
  <div class="dock-outer"><div class="dock-panel" id="dockPanel"><a class="dock-item" href="index.html?intro=1" title="返回片头"><span class="dock-item-icon">R</span><span class="dock-item-label">返回</span></a><a class="dock-item" href="index.html"><span class="dock-item-icon">H</span><span class="dock-item-label">主页</span></a><a class="dock-item" href="library.html"><span class="dock-item-icon">P</span><span class="dock-item-label">零件库</span></a><a class="dock-item" href="weapon-library.html"><span class="dock-item-icon">W</span><span class="dock-item-label">武器库</span></a><a class="dock-item" href="treasure-library.html"><span class="dock-item-icon">T</span><span class="dock-item-label">秘宝库</span></a></div></div>
  <div class="toast" id="toast" role="status" aria-live="assertive" hidden></div>
  <script src="data.js"></script><script src="core.js"></script><script src="treasure-library.js"></script>
</body></html>
