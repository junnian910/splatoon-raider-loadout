<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>配装器 · 武器库</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell library-page library-page--weapons">
    <section class="library-masthead">
      <div><h1>武器数据库</h1></div>
      <div class="stat-stack"><strong id="activeCount">0</strong><span>武器数量</span></div>
      <div class="library-actions"><button class="button button-solid" id="addWeapon" type="button">添加武器</button></div>
    </section>
    <section class="library-toolbar" aria-label="筛选武器">
      <label><span>搜索</span><input class="control" id="weaponSearch" type="search" placeholder="名称或描述"></label>
      <label><span>武器类型</span><select class="control" id="typeFilter"></select></label>
      <label><span>状态</span><select class="control" id="statusFilter"><option value="active">使用中</option><option value="deleted">已删除</option><option value="all">全部</option></select></label>
    </section>
    <section class="data-panel">
      <div class="data-head"><strong id="resultCount">0 条记录</strong><span>点击编辑修改；删除会保留历史配置中的快照</span></div>
      <div class="table-scroll"><table class="data-table"><thead><tr><th>武器图片</th><th>所属类型</th><th>武器名称</th><th>武器描述</th><th>操作</th></tr></thead><tbody id="weaponRows"></tbody></table></div>
    </section>
  </main>

  <dialog class="dialog editor-dialog" id="weaponDialog" aria-labelledby="weaponDialogTitle">
    <form id="weaponForm">
      <div class="dialog-head"><div><h2 id="weaponDialogTitle">添加武器</h2></div><button class="icon-button" data-close type="button">关闭</button></div>
      <div class="form-grid">
        <label><span>武器类型</span><select class="control" id="weaponType" required></select></label>
        <label><span>武器名称</span><input class="control" id="weaponName" required maxlength="40"></label>
        <label class="field-wide"><span>武器描述</span><input class="control" id="weaponDesc" maxlength="200" placeholder="武器说明"></label>
        <label class="field-wide"><span>武器图片</span><input class="control" id="weaponImage" type="file" accept="image/png,image/jpeg,image/webp"><small>上传武器的完整截图。</small></label>
        <div class="upload-preview field-wide" id="weaponImagePreview"></div>
      </div>
      <div class="dialog-actions"><button class="button button-quiet" data-close type="button">取消</button><button class="button button-solid" type="submit">保存武器</button></div>
    </form>
  </dialog>
  <dialog class="dialog dialog-share" id="confirmDialog">
    <div class="dialog-head"><h2>确认操作</h2></div>
    <p style="padding:1.5rem;margin:0;font-size:1.05rem;" id="confirmMessage"></p>
    <div class="dialog-actions" style="padding:0 1rem 1rem;"><button class="button button-quiet" id="confirmNo" type="button">取消</button><button class="button button-solid" id="confirmYes" type="button">确认</button></div>
  </dialog>
  <div class="dock-outer"><div class="dock-panel" id="dockPanel"><a class="dock-item" href="index.html"><span class="dock-item-icon">H</span><span class="dock-item-label">主页</span></a><a class="dock-item" href="library.html"><span class="dock-item-icon">P</span><span class="dock-item-label">零件库</span></a><a class="dock-item" href="weapon-library.html"><span class="dock-item-icon">W</span><span class="dock-item-label">武器库</span></a><a class="dock-item" href="treasure-library.html"><span class="dock-item-icon">T</span><span class="dock-item-label">秘宝库</span></a></div></div>
  <div class="toast" id="toast" role="status" aria-live="assertive" hidden></div>
  <script src="data.js"></script><script src="core.js"></script><script src="weapon-library.js"></script>
</body>
</html>
